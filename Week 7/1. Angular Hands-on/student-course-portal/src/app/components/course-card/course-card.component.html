<!-- Hands-On 3: Custom directive appHighlight, attribute directives ngClass and ngStyle -->
<div [ngClass]="cardClasses" [ngStyle]="borderStyle" [appHighlight]="appHighlightColor">
  <div class="card-header">
    <h3>{{ course.name }}</h3>
    <span class="course-code">{{ course.code }}</span>
  </div>

  <div class="card-body">
    <!-- Hands-On 3 Task 3: Custom CreditLabel Pipe -->
    <p class="credits-info">Credits: <strong>{{ course.credits | creditLabel }}</strong></p>

    <!-- Hands-On 3 Task 1 Step 27: *ngSwitch structural directive for grade status badges -->
    <div class="status-container" [ngSwitch]="course.gradeStatus">
      Status: 
      <span *ngSwitchCase="'passed'" class="badge badge-passed">Passed</span>
      <span *ngSwitchCase="'failed'" class="badge badge-failed">Failed</span>
      <span *ngSwitchDefault class="badge badge-pending">Pending</span>
    </div>

    <!-- Hands-On 3 Task 2 Step 31: Dynamic expanded details -->
    <div *ngIf="isExpanded" class="expanded-details">
      <hr>
      <p>Course ID: {{ course.id }}</p>
      <p>Department: Computer Science</p>
      <p>Enrollment Status: {{ isEnrolled ? 'Enrolled' : 'Not Enrolled' }}</p>
    </div>
  </div>

  <div class="card-actions">
    <!-- Hands-On 2 & 6: Enroll button emitting event and calling service -->
    <button class="btn-primary" (click)="onEnrollClick()">
      {{ isEnrolled ? 'Unenroll' : 'Enroll' }}
    </button>
    <button class="btn-secondary" (click)="toggleExpand()">
      {{ isExpanded ? 'Hide Details' : 'Show Details' }}
    </button>
  </div>
</div>
